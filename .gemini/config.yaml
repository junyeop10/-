code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    summary: true
    code_review: true
    include_drafts: true

ignore_patterns:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "server/uploads/**"
  - "server/cache.db"
  - "**/.env"
  - "data/**/*.db"
